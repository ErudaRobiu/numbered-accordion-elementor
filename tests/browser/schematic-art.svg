<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 424" width="1600" height="424" role="img" aria-labelledby="efsTitle efsDesc" font-family="'Plus Jakarta Sans','Inter',system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">
<title id="efsTitle">The ThermStar System, exhaust to load</title>
<desc id="efsDesc">Contaminated process exhaust enters a Lepido source unit. A sealed circuit carries the recovered energy to a HeatCore Hx delivery unit serving process or makeup air, process water or boiler feedwater. The two fluids never mix. ThermStar Power Intelligence reads both units.</desc>
<text x="0" y="22" fill="#8B9DA8" font-size="11" font-weight="600" text-anchor="start" letter-spacing="1.6">CONTAMINATED SIDE</text>
