<!DOCTYPE html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../../modules/badge/assets/css/spin-badge.css">
<style>
 body{font:16px/1.5 system-ui;margin:0;background:#16342a;color:#fff;
   min-height:200vh;display:grid;place-items:center}
 .ebdg{--ebdg-size:240px}

<a class="ebdg" href="https://example.com/calculator"
   data-ebdg-speed="8" data-ebdg-ramp="700"
   aria-label="Calculate savings"

          --ebdg-image: url('data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22200%22 height=%22200%22%3E%3Crect width=%22200%22 height=%22200%22 fill=%22%23884422%22/%3E%3C/svg%3E');
          --ebdg-overlay: 0.55;
          --ebdg-inner: inset 2px -4px 4px 0 rgba(0,0,0,0.15);
          --ebdg-text-size: 15px;">
 <span class="ebdg__disc">
  <svg class="ebdg__ring" viewBox="0 0 200 200" aria-hidden="true" focusable="false">
   <defs><path id="ebdg-path-1" fill="none" d="M 100,22 a 78,78 0 1,1 0,156 a 78,78 0 1,1 0,-156"/></defs>
   <text><textPath href="#ebdg-path-1" xlink:href="#ebdg-path-1" startOffset="0%">Calculate Savings • Calculate Savings • </textPath></text>
  </svg>
  <span class="ebdg__centre">
   <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 5 6 18"/><path d="M6 9v9h9"/></svg>
  </span>
 </span>
</a>

<script src="../../modules/badge/assets/js/spin-badge.js"></script>
